name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Download and install hidden-API android.jar
        run: |
          set -e
          TAG="36.1"
          JSON=$(curl -sL "https://api.github.com/repos/Reginer/aosp-android-jar/releases/tags/$TAG")
          URL=$(echo "$JSON" | grep -o '"browser_download_url": *"[^"]*android-36[^"]*\.jar"' | cut -d'"' -f4)
          if [ -z "$URL" ]; then
            echo "Could not find android-36 jar asset. Full release JSON:"
            echo "$JSON"
            exit 1
          fi
          echo "Downloading: $URL"
          curl -L -o android.jar "$URL"
          echo "Verifying it's a real jar/zip:"
          unzip -l android.jar | head -5
          cp android.jar "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
