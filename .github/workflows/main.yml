name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Install hidden-API android.jar
        run: |
          set -e
          git clone --depth 1 --branch 36.1 https://github.com/Reginer/aosp-android-jar.git aosp-jar-src
          cp aosp-jar-src/android-36/android.jar "$ANDROID_HOME/platforms/android-36/android.jar"
          echo "Verifying installed jar:"
          unzip -l "$ANDROID_HOME/platforms/android-36/android.jar" | head -5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
